<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Tasks</title>
<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial,
    sans-serif;
}

body {
    min-height:100vh;

}

h2 {

#message {

button#addTaskBtn {

button#addTaskBtn:hover {

}

#taskForm input, #taskForm select {

.tasks-container {

.card {

button#deleteAll {

button#deleteAll:hover {

#profile:hover {

#profile {

}

.profile-menu {

.modal {

.modal-content {

display:flex;

#taskEditorModal .editor-buttons button.cancelBtn {

.tasks-per-page {

#tasksPerPageSelect , #skip{

 #statusFilter, #priorityFilter{

<script>


const taskForm = document.getElementById("taskForm");
const addTaskBtn = document.getElementById("addTaskBtn");

addTaskBtn.addEventListener("click", ()=>
    taskForm.style.display = taskForm.style.display === "none" ? "block" : "none"
);

document.addEventListener("DOMContentLoaded", async () => {
    await health()
    const token = localStorage.getItem("access_token");

    if (!token) {
        window.location.replace("/users/login");
        return;
    }

    await fetchTasks();
});


const profileModal = document.getElementById("profileModal");

    profileModal.style.display = "none";
};

};

    if(e.key === "Escape"){

        profileModal.style.display = "none";
        taskEditorModal.style.display = "none";

    }

});

window.addEventListener("click", function(event){

    const profileModal = document.getElementById("profileModal");
    const taskEditorModal = document.getElementById("taskEditorModal");

    if(event.target === profileModal){
        profileModal.style.display = "none";
    }

    if(event.target === taskEditorModal){
        taskEditorModal.style.display = "none";
    }

});

async function refreshAccessToken() {
    const refresh_token = localStorage.getItem("refresh_token");

    if (!refresh_token) {
        window.location.replace("/users/login");
        return null;
    }

    try {
        const res = await fetch("/users/refresh", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${refresh_token}`
            },
        });

        const data = await res.json();

        if (res.ok && data.access_token) {
            localStorage.setItem("access_token", data.access_token);
            return data.access_token;
        } else {
            localStorage.clear();
            window.location.href = "/users/login";
            return null;
        }

    } catch (err) {
        localStorage.clear();
        window.location.href = "/users/login";
        return null;
    }
}

function formatDate(dateString){
    const date = new Date(dateString);

    return date.toLocaleString("en-GB", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

async function health(){
    try {
        let access_token = localStorage.getItem("access_token");

        let res = await fetch("/health", {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${access_token}`
            },
        });

        if(res.status === 401){
            access_token = await refreshAccessToken();
            if(!access_token) return;

            res = await fetch("/health", {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${access_token}`
                },
            });
        }
        const data = await res.json();

        if (data.app !== "ok" && data.database !== "ok") {
            alert("Server and Database are down!");
        } else if (data.app !== "ok") {
            alert("Server is down!");
        } else if (data.database !== "ok") {
            alert("Database connection is down!");
        }
    }
     catch(err){
        message.style.color = "red";
        message.innerText = "❌ Server error";
        console.error(err);
    }
}

async function createTask(e){
    e.preventDefault();
    const title = document.getElementById("taskTitle").value;
    const description = document.getElementById("taskDesc").value;
    const priority = document.getElementById("taskPriority").value;
    const message = document.getElementById("message");

    if(!title || !description) return alert("Fill all fields");

    let createTaskBtn = document.getElementById("createTask");
    createTaskBtn.disabled = true;
    createTaskBtn.style.background =  "#424141"
    createTaskBtn.innerText = "Creating...";
    try {
        await health()

        let access_token = localStorage.getItem("access_token");

        let res = await fetch("/tasks/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${access_token}`
            },
            body: JSON.stringify({ title, description, priority })
        });

        if(res.status === 401){
            access_token = await refreshAccessToken();
            if(!access_token) return;

            res = await fetch("/tasks/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${access_token}`
                },
                body: JSON.stringify({ title, description, priority })
            });
        }

        const data = await res.json();

       if(res.ok){
            taskForm.reset();
            taskForm.style.display = "none";
            await fetchTasks();
            message.style.color = "green";
            message.innerText = data.message || "Task created successfully!";
            setTimeout(() => { message.innerText = ""; }, 3000);
        } else {
            message.style.color = "red";

            if(data.detail && Array.isArray(data.detail)){
                const title2 = document.getElementById("taskTitle")
                const desc = document.getElementById("taskDesc")
                const errors = data.detail.map(err => {
                    const field = err.loc[1];
                    if (field === "title"){
                        title2.style.border= "2px solid red";
                    }
                    if(field === "description"){
                        desc.style.border= "2px solid red";
                    }
                    return `${field} : ${err.msg}`;
                }).join("\n");
                message.innerText = errors;
                setTimeout(() => { message.innerText = ""; }, 5000);
            } else
                message.innerText = data.msg || data.message || "❌ Could not create task";
                setTimeout(() => { message.innerText = ""; }, 3000);
        }

    } catch(err){
        message.style.color = "red";
        message.innerText = "❌ Server error";
        console.error(err);
    }
    finally {
        createTaskBtn.disabled = false;
        createTaskBtn.style.background = "#667eea"
        createTaskBtn.innerText = "Create Task"
    }

}


async function deleteTask(id,btn){
    const message = document.getElementById("message");
    message.innerText = "";

    if(!confirm("Are you sure to delete this task?")) return;

    btn.disabled=true;
    try {
        await health()
        let access_token = localStorage.getItem("access_token");

        let res = await fetch(`/tasks/${id}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${access_token}` }
        });

        if(res.status === 401){
            access_token = await refreshAccessToken();
            if(!access_token) return;

            res = await fetch(`/tasks/${id}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${access_token}` }
            });
        }

        const data = await res.json();

        if(res.ok){
            await fetchTasks();
            message.style.color = "green";
            message.innerText = data.message || "Task deleted successfully!";
            setTimeout(() => message.innerText = "", 3000);
        } else {
            message.style.color = "red";
            message.innerText = data.message || data.detail || "❌ Could not delete task";
        }

    } catch(err){
        message.style.color = "red";
        message.innerText = "❌ Server error";
        console.error(err);
    }
    finally {
        btn.disabled=false;
    }
}


async function deleteAllTasks(){
    const message = document.getElementById("message");
    message.innerText = "";

    if(!confirm("Delete ALL your tasks?")) return;

    deleteAllBtn =document.getElementById("deleteAll")
    deleteAllBtn.disabled=true;
    deleteAllBtn.innerText = "Deleting ..."
    deleteAllBtn.style.background = "#424141"
    try {
        await health()
        let access_token = localStorage.getItem("access_token");

        let res = await fetch("/tasks/all", {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${access_token}` }
        });

        if(res.status === 401){
            access_token = await refreshAccessToken();
            if(!access_token) return;

            res = await fetch("/tasks/all", {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${access_token}` }
            });
        }

        const data = await res.json();

        if(res.ok){
            await fetchTasks();
            message.style.color = "green";
            message.innerText = data.message || "All tasks deleted!";
            setTimeout(() => message.innerText = "", 3000);
        } else {
            message.style.color = "red";
            message.innerText = data.message || data.detail || "❌ Could not delete all tasks";
            setTimeout(() => message.innerText = "", 3000);
        }

    } catch(err){
        message.style.color = "red";
        message.innerText = "❌ Server error";
        console.error(err);
    }
    finally {
        deleteAllBtn.disabled=false;
        deleteAllBtn.innerText = "Delete All Tasks"
        deleteAllBtn.style.background = "#4e57a8"
    }
}


const taskEditorModal = document.getElementById("taskEditorModal");
const editorTitle = document.getElementById("editorTitle");
const editorDesc = document.getElementById("editorDesc");
const editorPriority = document.getElementById("editorPriority");
const editorStatus = document.getElementById("editorStatus");
const editorSave = document.getElementById("editorSave");
const editorCancel = document.getElementById("editorCancel");

let editingTaskId = null;

function openTaskEditor(task){
    editingTaskId = task.task_id;
    editorTitle.value = task.title;
    editorDesc.value = task.description;
    editorPriority.value = task.priority;
    editorStatus.value = task.status;
    taskEditorModal.style.display = "flex";
}

editorCancel.addEventListener("click", () => {
    taskEditorModal.style.display = "none";
});

editorSave.addEventListener("click", async () => {
    const title = editorTitle.value.trim();
    const desc = editorDesc.value.trim();
    const priority = editorPriority.value;
    const status = editorStatus.value;
    const message = document.getElementById("message");

    if(!title || !desc){
        alert("Title and description are required");
        return;
    }

    editorSave.disabled=true;
    try {
        let access_token = localStorage.getItem("access_token");
        let res = await fetch(`/tasks/${editingTaskId}`, {
            method:"PATCH",
            headers: {
                "Content-Type":"application/json",
                "Authorization":`Bearer ${access_token}`
            },
            body: JSON.stringify({title, description: desc, priority, status})
        });

        if(res.status === 401){
            access_token = await refreshAccessToken();
            if(!access_token) return;
            res = await fetch(`/tasks/${editingTaskId}`, {
                method:"PATCH",
                headers: {
                    "Content-Type":"application/json",
                    "Authorization":`Bearer ${access_token}`
                },
                body: JSON.stringify({title, description: desc, priority, status})
            });
        }

        const data = await res.json();

        if(res.ok){
            await fetchTasks();
            message.style.color = "green";
            message.innerText = data.message || "Task updated successfully!";
            setTimeout(() => message.innerText="", 3000);

modalSave.addEventListener("click", async () => {
    const message = document.getElementById("message");
    message.innerText = "";

    const newName = document.getElementById("modalName").value.trim();
    const oldPassword = document.getElementById("modalOldPassword").value.trim();
    const newPassword = document.getElementById("modalNewPassword").value.trim();

    if(newPassword && !oldPassword){
        message.style.color = "red";
        message.innerText = "Old password is required";
        return;
    }

    const body = {};
    if(newName) body.name = newName;
    if(oldPassword && newPassword){
        body.old_password = oldPassword;
        body.new_password = newPassword;
    }

    if(Object.keys(body).length === 0){
        message.style.color = "red";
        message.innerText = "No changes provided";
        return;
    }

    modalSave.disabled=true;
    try {
        let access_token = localStorage.getItem("access_token");

        let res = await fetch(`/users/profile/${user_id}`, {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${access_token}`
            },
            body: JSON.stringify(body)
        });

        if(res.status === 401){
            access_token = await refreshAccessToken();
            if(!access_token) return;

            res = await fetch(`/users/profile/${user_id}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${access_token}`
                },
                body: JSON.stringify(body)
            });
        }

        const data = await res.json();
        let msg = data.message || data.detail || "❌ Could not update profile";

        if(res.ok){
            message.style.color = "green";
            message.innerText = msg;
            modal.style.display = "none";
            document.getElementById("modalName").value = "";
            document.getElementById("modalOldPassword").value = "";
            document.getElementById("modalNewPassword").value = "";
            setTimeout(() => message.innerText = "", 3000);
        } else {
            message.style.color = "red";
            message.innerText = msg;
        }

    } catch(err){
        message.style.color = "red";
        message.innerText = "❌ Server error";
        console.error(err);
    }
    finally {
        modalSave.disabled=false;
    }
});

let filteredTasks = [];

async function fetchTasksByFilter(priority=null, status=null) {
    const container = document.getElementById("tasksContainer");
    const message = document.getElementById("message");
    const loading = document.getElementById("loading");
    container.innerHTML = "";
    message.innerText = "";
    loading.style.display = "flex";

    const priorityFilter = document.getElementById("priorityFilter").value || null;
    const statusFilter = document.getElementById("statusFilter").value || null;

    if(priorityFilter) priority = priorityFilter;
    if(statusFilter) status = statusFilter;

    if(!priority && !status){
        await fetchTasks()
        return
    }

    try {
        let access_token = localStorage.getItem("access_token");

        let url = `/tasks/prio_stat?`;
        if(priority) url += `priority=${priority}`;
        if(status) url += `&status=${status}`;

        let res = await fetch(url, {
            method: "GET",
            headers: { "Authorization": `Bearer ${access_token}` }
        });

        if(res.status === 401){
            access_token = await refreshAccessToken();
            if(!access_token) return;
            res = await fetch(url, {
                method: "GET",
                headers: { "Authorization": `Bearer ${access_token}` }
            });
        }

        const data = await res.json();

        loading.style.display = "none";

        if(res.ok) {
            filteredTasks = data.tasks || [];
            const tasks = data.tasks;
            if(!tasks || tasks.length === 0){
                container.innerHTML = `<p style="text-align:center;color:#555;">
                                        No tasks found for selected filter.
                                        </p>`;
                return;
            }

            currentPage = 1;
            renderTasksPage(currentPage);


        } else {
            message.style.color = "red";
            message.innerText = data.message || "❌ Could not fetch tasks";
        }

    } catch(err) {
        loading.style.display = "none";
        message.style.color = "red";
        message.innerText = "❌ Server connection error";
        console.error(err);
    }
}

function renderTasksPage(page) {
    const container = document.getElementById("tasksContainer");
    const pagination = document.getElementById("pagination");
    container.innerHTML = "";

    const start = (page - 1) * tasksPerPage;
    const end = start + tasksPerPage;
    const tasksToShow = filteredTasks.slice(start, end);

    tasksToShow.forEach(task => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <h3>${task.title}</h3>
            <p>${task.description}</p>
            <p>Priority: ${task.priority}</p>
            <p>Status: ${task.status}</p>
            <p>Created: ${formatDate(task.created_at)}</p>
            <p>Updated: ${formatDate(task.updated_at)}</p>
             <button class="update">Update</button>
            <button class="delete">Delete</button>
            `;

            const btnUpdate = card.querySelector(".update");
            const btnDelete = card.querySelector(".delete");


            btnUpdate.addEventListener("click", () => openTaskEditor(task));
            btnDelete.addEventListener("click", () => deleteTask(task.task_id,btnDelete));

            container.appendChild(card);
    });

    pagination.innerHTML = "";
    const totalPages = Math.ceil(filteredTasks.length / tasksPerPage);

    if(totalPages <= 1) return;

    if(page > 1){
        const prevBtn = document.createElement("button");
        prevBtn.innerText = "Prev";
        prevBtn.onclick = () => { currentPage--; renderTasksPage(currentPage); };
        pagination.appendChild(prevBtn);
    }

    for(let i = 1; i <= totalPages; i++){
        const pageBtn = document.createElement("button");
        pageBtn.innerText = i;
        pageBtn.disabled = (i === page);
        pageBtn.onclick = () => { currentPage = i; renderTasksPage(currentPage); };
        pagination.appendChild(pageBtn);
    }

    if(page < totalPages){
        const nextBtn = document.createElement("button");
        nextBtn.innerText = "Next";
        nextBtn.onclick = () => { currentPage++; renderTasksPage(currentPage); };
        pagination.appendChild(nextBtn);
    }
}
