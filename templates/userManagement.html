<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(135deg,#d8ddfa,#f3e8ff);
    min-height:100vh;
    padding:40px;
}

h2{
    margin-bottom:20px;
}

.admin-container{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}


.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tabs button{
    padding:10px 20px;
    border:none;
    background:#667eea;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.tabs button.active{
    background:#4a5bdc;
}


table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#f6f7ff;
}

tr:hover{
    background:#f3f4ff;
}


.action-btn{
    padding:6px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    color:white;
}

.role-btn{
    background:#667eea;
}

.delete-btn{
    background:#e74c3c;
}


.section{
    display:none;
}

.section.active{
    display:block;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.task{
    background:#667eea;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
}

.task:hover{
    background:#4a5bdc;
}


h2, h3 {
    color: #2f1843;
    margin-bottom:20px;
    text-align:center;
}

#message {
    text-align:center;
    color:red;
    margin-bottom:20px;
    font-size:14px;
}

.role-select{
    padding:3px 7px;
    border-radius:6px;
    background: #667eea;
    color: white;
}

.pagination-btn {
    padding: 6px 14px;
    margin: 5px 2px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #667eea;
    color: white;
    font-weight: bold;
    transition: background 0.3s;
}

.pagination-btn:hover {
    background: #4a5bdc;
}

.pagination-btn:disabled {
    background: #b0b0d8;
    cursor: not-allowed;
}

#search{
    color: black;
    font-size:17px;
    padding: 6px ;
    margin-bottom: 20px;
    border-radius: 25px;
    border-color: #7e92e1;
    width: 30%;
}


</style>
</head>


<body>

<h2> User Management </h2>
<div class="top-bar">
<button onclick="goToTasks()" class="task">← Tasks</button>
</div>

<p id="message"></p>

<div class="admin-container">


<div class="tabs">
<button id="usersTab" class="active">Users</button>
<button id="logsTab">Logs</button>
</div>



<div id="usersSection" class="section active">

<h3>Users</h3>

<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="usersTable"></tbody>
</table>

<div id="usersPagination" style="margin-top:10px; text-align:center;"></div>

</div>




<div id="logsSection" class="section">

<h3>Logs</h3>

<input type="search" id="search" autocomplete="off" placeholder="search..." >

<table>

<thead>
<tr>
<th>ID</th>
<th>Method</th>
<th>Path</th>
<th>Status</th>
<th>User</th>
<th>Date</th>
</tr>
</thead>

<tbody id="logsTable"></tbody>

</table>
</div>

<div id="logsPagination" style="margin-top:10px; text-align:center;"></div>


</div>

<script>
async function refreshAccessToken() {
    const refresh_token = localStorage.getItem("refresh_token");

    if (!refresh_token) {
        window.location.replace("/users/login");
        return null;
    }

    try {
        const res = await fetch("/users/refresh", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${refresh_token}`
            },
        });

        const data = await res.json();

        if (res.ok && data.access_token) {
            localStorage.setItem("access_token", data.access_token);
            return data.access_token;
        } else {
            localStorage.clear();
            window.location.href = "/users/login";
            return null;
        }

    } catch (err) {
        localStorage.clear();
        window.location.href = "/users/login";
        return null;
    }
}

function goToTasks(){
    window.location.href = "/tasks";
}


document.addEventListener("DOMContentLoaded", async () => {

    let access_token = localStorage.getItem("access_token");

    if (!access_token) {
        window.location.replace("/users/login");
        return;
    }

    access_token = await refreshAccessToken();
console.log("new token:", access_token);
    if (!access_token) return;

    await fetchUsers();
});

const usersTab = document.getElementById("usersTab");
const logsTab = document.getElementById("logsTab");

const usersSection = document.getElementById("usersSection");
const logsSection = document.getElementById("logsSection");

usersTab.onclick = () =>{

usersTab.classList.add("active");
logsTab.classList.remove("active");

usersSection.classList.add("active");
logsSection.classList.remove("active");

document.getElementById("usersPagination").style.display = "block";
document.getElementById("logsPagination").style.display = "none";

}

logsTab.onclick = () =>{

logsTab.classList.add("active");
usersTab.classList.remove("active");

logsSection.classList.add("active");
usersSection.classList.remove("active");

document.getElementById("usersPagination").style.display = "none";
document.getElementById("logsPagination").style.display = "block";

}

usersTab.addEventListener("click", async () =>{
    if(!usersTab.classList.contains("active")) {
        await fetchUsers();
}
})


logsTab.addEventListener("click", async () =>{
    await fetchLogs()
})




const PAGE_SIZE = 15;

let allUsers = [];
let allLogs = [];
let currentUsersPage = 1;
let currentLogsPage = 1;

async function fetchUsers(page = 1){
    const message = document.getElementById("message");

    try{
        let access_token = localStorage.getItem("access_token");
        let res = await fetch("/users/view",{
            method:"GET",
            headers:{ "Authorization":`Bearer ${access_token}` }
        });

        if(res.status===401){
            access_token = await refreshAccessToken();
            if(!access_token) return;
            res = await fetch("/users/view",{
                method:"GET",
                headers:{ "Authorization":`Bearer ${access_token}` }
            });
        }

        const data = await res.json();

        if(res.ok){
            allUsers = data.users;
            renderUsersPage(page);
        } else{
            message.innerText = data.detail || "Cannot load users";
        }

    } catch(err){
        message.innerText = "Server error";
        console.error(err);
    }
}

function renderUsersPage(page){
    const usersTable = document.getElementById("usersTable");
    const usersPagination = document.getElementById("usersPagination");

    currentUsersPage = page;

    const totalPages = Math.ceil(allUsers.length / PAGE_SIZE);
    const start = (page - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const pageData = allUsers.slice(start, end);

    usersTable.innerHTML = "";
    pageData.forEach(user => {
        usersTable.innerHTML += `
        <tr>
            <td>${user.ID}</td>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>
                <select class="role-select">
                    <option value="USER" ${user.role==="USER" ? "selected" : ""}>USER</option>
                    <option value="ADMIN" ${user.role==="ADMIN" ? "selected" : ""}>ADMIN</option>
                </select>
            </td>
            <td>
                <button class="action-btn role-btn" data-id="${user.ID}">Change Role</button>
                <button class="action-btn delete-btn" data-id="${user.ID}">Delete user</button>
            </td>
        </tr>`;
    });

    usersPagination.innerHTML = "";

    const prevBtn = document.createElement("button");
    prevBtn.innerText = "← Previous";
    prevBtn.classList.add("pagination-btn");
    prevBtn.disabled = page === 1;
    prevBtn.onclick = () => renderUsersPage(page - 1);
    usersPagination.appendChild(prevBtn);

    const nextBtn = document.createElement("button");
    nextBtn.innerText = "Next →";
    nextBtn.classList.add("pagination-btn");
    nextBtn.disabled = page === totalPages;
    nextBtn.style.marginLeft = "10px";
    nextBtn.onclick = () => renderUsersPage(page + 1);
    usersPagination.appendChild(nextBtn);

    activateUserButtons();
}

async function fetchLogs(page = 1){
    const message = document.getElementById("message");


    try{
        let access_token = localStorage.getItem("access_token");
        let res = await fetch("/logged/view",{
            method:"GET",
            headers:{ "Authorization":`Bearer ${access_token}` }
        });

        if(res.status===401){
            access_token = await refreshAccessToken();
            if(!access_token) return;
            res = await fetch("/logged/view",{
                method:"GET",
                headers:{ "Authorization":`Bearer ${access_token}` }
            });
        }

        const data = await res.json();

        if(res.ok){
            allLogs = data.result;
            renderLogsPage(page);
        } else{
            message.innerText = data.detail || "Cannot load logs";
        }

    } catch(err){
        message.innerText = "Server error";
        console.error(err);
    }
}

function renderLogsPage(page){
    const logsTable = document.getElementById("logsTable");
    const logsPagination = document.getElementById("logsPagination");

    currentLogsPage = page;

    const totalPages = Math.ceil(allLogs.length / PAGE_SIZE);
    const start = (page - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const pageData = allLogs.slice(start, end);

    logsTable.innerHTML = "";
    pageData.forEach(log => {
        logsTable.innerHTML += `
        <tr>
            <td>${log.id}</td>
            <td>${log.method}</td>
            <td>${log.path}</td>
            <td>${log.status}</td>
            <td>${log.user}</td>
            <td>${log.date}</td>
        </tr>`;
    });

    logsPagination.innerHTML = "";
    const prevBtn = document.createElement("button");
    prevBtn.innerText = "← Previous";
    prevBtn.classList.add("pagination-btn");
    prevBtn.disabled = page === 1;
    prevBtn.onclick = () => renderLogsPage(page - 1);
    logsPagination.appendChild(prevBtn);

    const nextBtn = document.createElement("button");
    nextBtn.innerText = "Next →";
    nextBtn.classList.add("pagination-btn");
    nextBtn.disabled = page === totalPages;
    nextBtn.onclick = () => renderLogsPage(page + 1);
    logsPagination.appendChild(nextBtn);
}

function activateUserButtons(){
    document.querySelectorAll(".role-btn").forEach(btn => {
        btn.onclick = async () => {
            const userId = btn.getAttribute("data-id");
            const row = btn.closest("tr");
            const select = row.querySelector(".role-select");
            const newRole = select.value;

            let access_token = localStorage.getItem("access_token");
            try {
                let res = await fetch(`/users/role/${userId}?new_role=${newRole}`, {
                    method: "PATCH",
                    headers: {"Authorization": `Bearer ${access_token}`}
                });
                if(res.status===401){
                    access_token = await refreshAccessToken();
                    if(!access_token) return;
                    res = await fetch(`/users/role/${userId}?new_role=${newRole}`, {
                        method: "PATCH",
                        headers: {"Authorization": `Bearer ${access_token}`}
                    });
                }
                const data = await res.json();
                if(res.ok){
                    alert(data.message || "Role updated!");
                    fetchUsers(currentUsersPage);
                } else alert(data.detail || "Cannot update role");
            } catch(err){ console.error(err); alert("Server error"); }
        };
    });

    document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.onclick = async () => {
            const userId = btn.getAttribute("data-id");
            if(!confirm("Are you sure you want to delete this account?")) return;
            let access_token = localStorage.getItem("access_token");
            try {
                let res = await fetch(`/users/${userId}`, {
                    method: "DELETE",
                    headers: {"Authorization": `Bearer ${access_token}`}
                });
                if(res.status===401){
                    access_token = await refreshAccessToken();
                    if(!access_token) return;
                    res = await fetch(`/users/${userId}`, {
                        method: "DELETE",
                        headers: {"Authorization": `Bearer ${access_token}`}
                    });
                }
                const data = await res.json();
                if(res.ok){
                    alert(data.message || "Account deleted");
                    fetchUsers(currentUsersPage);
                } else alert(data.message || data.detail || "Delete failed");
            } catch(err){ console.error(err); alert("Server error"); }
        };
    });
}


document.getElementById("search").addEventListener("input", function () {
    const key = this.value;
    fetchSearchLogs(key, 1);
});



async function fetchSearchLogs(key, page = 1) {
    let access_token = localStorage.getItem("access_token");
    const logsTable = document.getElementById("logsTable");

    try {
        let res = await fetch(`/logged/search?key=${encodeURIComponent(key)}`, {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${access_token}`
            }
        });

        if(res.status === 401){
            access_token = await refreshAccessToken();
            if(!access_token) return;
            res = await fetch(`/logged/search?key=${encodeURIComponent(key)}`, {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${access_token}`
                }
            });
        }

        const data = await res.json();

        if(res.ok) {
            allLogs = data.result || [];
            if (!allLogs || allLogs.length === 0) {
                logsTable.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align:center;color:#555;">
                            Nothing found.
                        </td>
                    </tr>`;
                return;
            }

            renderLogsPage(page);
        } else {
            console.error(data.message || data.detail || "Search failed");
        }

    } catch(err){
        console.error(err);
    }
}</script>

</body>
</html>
